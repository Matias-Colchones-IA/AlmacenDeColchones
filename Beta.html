<!-- =======================================================
     CUESTIONARIO RECOMENDADOR DE COLCHONES (HECHO A MEDIDA)
     ======================================================= -->

<!-- 1. EL BOTÓN FLOTANTE QUE ABRE EL TEST -->
<div id="btn-abrir-test" style="position: fixed; bottom: 125px; right: 15px; background: #614a3b; color: white; padding: 12px 18px; border-radius: 30px; cursor: pointer; z-index: 99998; box-shadow: 0 4px 15px rgba(0,0,0,0.3); font-weight: bold; font-family: sans-serif; display: flex; align-items: center; gap: 8px; font-size: 14px; transition: transform 0.2s;">
   Encontrá tu colchón ideal
</div>


<!-- 2. LA VENTANA EMERGENTE (MODAL) -->
<div id="modal-test" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.75); z-index: 999999; justify-content: center; align-items: center; font-family: sans-serif; backdrop-filter: blur(3px);">
    <div style="background: white; width: 90%; max-width: 450px; border-radius: 16px; padding: 30px; position: relative; box-shadow: 0 10px 30px rgba(0,0,0,0.5);">
        <span id="cerrar-test" style="position: absolute; top: 15px; right: 20px; font-size: 26px; cursor: pointer; color: #999; font-weight: bold;">&times;</span>
        
        <h3 style="color: #614a3b; text-align: center; margin-top: 0; font-size: 20px; font-weight: 800; border-bottom: 2px solid #f1ebd8; padding-bottom: 15px; margin-bottom: 20px;">
            Asesor Virtual
        </h3>
        
        <!-- Acá adentro JavaScript va a ir dibujando las preguntas -->
        <div id="quiz-contenido" style="min-height: 200px;"></div>
        
        <!-- Botonera de navegación -->
        <div style="display: flex; justify-content: space-between; margin-top: 25px;">
            <button id="btn-test-prev" style="visibility: hidden; background: #eaeaea; color: #555; border: none; padding: 10px 15px; border-radius: 8px; cursor: pointer; font-weight: bold;">← Atrás</button>
            <button id="btn-test-next" style="display: none; background: #827c34; color: white; border: none; padding: 10px 25px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 15px;">Siguiente →</button>
            <button id="btn-test-final" style="display: none; background: #c9732b; color: white; border: none; padding: 10px 25px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 15px;">Ver resultados</button>
        </div>
    </div>
</div>

<!-- 3. LOS ESTILOS DE LOS BOTONES DEL TEST -->
<style>
    #btn-abrir-test:hover { transform: scale(1.05); }
    .quiz-opcion { display: flex; align-items: center; gap: 12px; width: 100%; padding: 16px; margin-bottom: 12px; border: 2px solid #eaeaea; border-radius: 12px; background: white; cursor: pointer; text-align: left; font-size: 15px; color: #333; font-weight: 600; transition: all 0.2s ease; }
    .quiz-opcion:hover { border-color: #827c34; background: #fcfbf8; }
    .quiz-opcion.seleccionada { border-color: #827c34; background: #f1ebd8; box-shadow: 0 4px 0 #827c34; transform: translateY(-2px); }
</style>

<!-- 4. EL CEREBRO DEL CUESTIONARIO (JAVASCRIPT) -->
<script>
window.addEventListener('load', function() {
    
    // --- A. LAS PREGUNTAS Y OPCIONES ---
    const preguntas = [
        {
            id: 'tamano',
            titulo: 'Paso 1: ¿Qué tamaño de colchón buscás?',
            opciones: [
                { valor: '1plaza', texto: '1 Plaza (80x190)' },
                { valor: '1plaza_media', texto: '1 Plaza y media (100x190)' },
                { valor: '2plazas', texto: '2 Plazas (140x190)' }
            ]
        },
        {
            id: 'firmeza',
            titulo: 'Paso 2: ¿Qué sensación preferís?',
            opciones: [
                { valor: 'suave', texto: 'Suave y mullido (Resortes)' },
                { valor: 'firme', texto: 'Firme (Espuma Alta Densidad)' }
            ]
        }
    ];

    // Variables internas
    let pasoActual = 0;
    let respuestas = {}; 

    // Elementos visuales
    const modal = document.getElementById('modal-test');
    const contenedor = document.getElementById('quiz-contenido');
    const btnNext = document.getElementById('btn-test-next');
    const btnPrev = document.getElementById('btn-test-prev');
    const btnFinal = document.getElementById('btn-test-final');

    // Abrir y cerrar modal
    document.getElementById('btn-abrir-test').addEventListener('click', () => { modal.style.display = 'flex'; dibujarPaso(); });
    document.getElementById('cerrar-test').addEventListener('click', () => { modal.style.display = 'none'; });

    // Dibuja la pregunta actual en la pantalla
    function dibujarPaso() {
        const pregunta = preguntas[pasoActual];
        let html = `<h4 style="margin-top:0; color:#555; font-size: 16px;">${pregunta.titulo}</h4>`;
        
        pregunta.opciones.forEach(op => {
            const esSeleccionada = respuestas[pregunta.id] === op.valor ? 'seleccionada' : '';
            html += `<button class="quiz-opcion ${esSeleccionada}" data-valor="${op.valor}">${op.texto}</button>`;
        });
        
        contenedor.innerHTML = html;

        // Le damos vida a las opciones
        document.querySelectorAll('.quiz-opcion').forEach(btn => {
            btn.addEventListener('click', function() {
                // Desmarcamos todas y marcamos la tocada
                document.querySelectorAll('.quiz-opcion').forEach(b => b.classList.remove('seleccionada'));
                this.classList.add('seleccionada');
                
                // Guardamos la respuesta
                respuestas[pregunta.id] = this.getAttribute('data-valor');
                
                // Mostramos el botón "Siguiente" o "Ver resultados"
                actualizarBotonera();
            });
        });

        actualizarBotonera();
    }

    // Oculta/Muestra los botones de abajo según el paso
    function actualizarBotonera() {
        btnPrev.style.visibility = pasoActual > 0 ? 'visible' : 'hidden';
        
        const tieneRespuesta = respuestas[preguntas[pasoActual].id] !== undefined;
        
        if (pasoActual === preguntas.length - 1) { // Si es el último paso
            btnNext.style.display = 'none';
            btnFinal.style.display = tieneRespuesta ? 'block' : 'none';
        } else {
            btnFinal.style.display = 'none';
            btnNext.style.display = tieneRespuesta ? 'block' : 'none';
        }
    }

    // Botones de navegación
    btnNext.addEventListener('click', () => { pasoActual++; dibujarPaso(); });
    btnPrev.addEventListener('click', () => { pasoActual--; dibujarPaso(); });

    // --- B. LA MAGIA: EVALUAR RESPUESTAS Y REDIRIGIR ---
    btnFinal.addEventListener('click', () => {
        btnFinal.innerText = "Buscando...";
        
        let urlDestino = "/"; // Por defecto manda a la página principal
        
        // EJEMPLO DE LÓGICA:
        if (respuestas.tamano === '1plaza' && respuestas.firmeza === 'suave') {
            urlDestino = "/colchones/1-plaza/"; 
        } 
        else if (respuestas.tamano === '2plazas' && respuestas.firmeza === 'firme') {
            urlDestino = "/colchones/2-plazas/?sort_by=price-desc"; 
        }
        else {
            urlDestino = "/colchones/"; 
        }

        // Redirige al cliente después de 1 segundo
        setTimeout(() => {
            window.location.href = urlDestino;
        }, 1000);
    });
});
</script>
